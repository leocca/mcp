<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Audit Dashboard{% endblock %} | DevOps Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body class="bg-dark text-light">
    <!-- Toast container pour les alertes temps réel -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" style="z-index: 1080;"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar d-print-none">
                <div class="sidebar-header d-flex align-items-center gap-2 py-3 px-3">
                    <i class="bi bi-shield-lock-fill text-primary fs-3"></i>
                    <div>
                        <h5 class="mb-0">Audit Dashboard</h5>
                        <small class="text-muted">DevOps Assistant</small>
                    </div>
                </div>
                <ul class="nav flex-column px-2">
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard_view') }}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'timeline' %}active{% endif %}" href="{{ url_for('timeline_view') }}">
                            <i class="bi bi-list-ul"></i> Timeline des actions
                        </a>
                    </li>
                </ul>
                <div class="sidebar-footer mt-auto px-3 py-3 border-top">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-person-circle fs-4"></i>
                            <div>
                                <small class="d-block text-truncate" style="max-width: 120px;">{{ user.username }}</small>
                                <small class="text-muted">{{ user.roles|join(', ') }}</small>
                            </div>
                        </div>
                        <a class="btn btn-sm btn-outline-danger" href="{{ url_for('logout') }}" title="Se déconnecter">
                            <i class="bi bi-box-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </nav>

            <!-- Contenu principal -->
            <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom d-print-none">
                    <h1 class="h4">{% block page_title %}{% endblock %}</h1>
                    <div class="d-flex gap-2 align-items-center">
                        <span id="connection-status" class="badge bg-secondary"><i class="bi bi-hdd"></i> Connexion…</span>
                    </div>
                </div>
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/sse.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
